name: Build Aref APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Extract project
        run: unzip -o "Aref-Calculator (1).zip" -d extracted
      - name: Get packages
        working-directory: extracted/aref_calculator
        run: flutter pub get
      - name: Test
        working-directory: extracted/aref_calculator
        run: flutter test
      - name: Build APK
        working-directory: extracted/aref_calculator
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aref-release-apk
          path: extracted/aref_calculator/build/app/outputs/flutter-apk/app-release.apk
